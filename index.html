<html>
    <head>
        <title>demo</title>
    </head>
    <body>
        <p>v1- includes image drop, copy</p>

        <div id="drop" tabindex="0" role="button" aria-label="Choose an image">
            drop image
        </div>
        <input type="file" id="file" accept="image/*" hidden>

        <button id="copy" disabled>copy</button>
        <p id="status" role="status" aria-live="polite">waiting for input</p>

        <div id="output">
            <pre>no image, yet</pre>
        </div>

        <script>
            const COLUMNS = 100;
            const CHARACTERS = ' .:-=+*#%@' ;

            const dropZone = document.getElementById('drop');
            const fileInput = document.getElementById('file');
            const copyButton = document.getElementById('copy');
            const statusLine= document.getElementById('status');
            const output = document.getElementById('output');

            let currentImage = null;
            let asciiText = '';

            function setStatus(message) {
                statusLine.textContent = message;
            }

            function getPixels(image, columns, rows) {
                const canvas = document.createElement('canvas');
                canvas.width = columns;
                canvas.height = rows;

                const context = canvas.getContext('2d', { willReadFrequently: true});

                context.fillStyle = '#fff';
                context.fillRect(0, 0, columns, rows);
                context.drawImage(image, 0, 0, columns, rows);
                
                return context.getImageData(0, 0, columns, rows).data;
            }

            function pixelToCharacter(red, green, blue) {
                let brightness = (0.2126 * red + 0.7152 * green + 0.0722 * blue) / 255;

                const index = Math.round((1 - brightness)*(CHARACTERS.length - 1));
                return CHARACTERS[index];
            }

            function render() {
                if (!currentImage) return;

                const aspectRatio = currentImage.height / currentImage.width;
                const rows = Math.max(1, Math.round(COLUMNS * aspectRatio * 0.5));

                const pixels = getPixels(currentImage, COLUMNS, rows);
                const lines = [];

                for (let row = 0; row < rows; row++) {
                    let line = '';
                    for(let column = 0; column < COLUMNS; column++) {
                        const i = (row * COLUMNS + column) * 4;
                        line += pixelToCharacter(pixels[i], pixels[i + 1], pixels[i + 2]);
                    }
                    lines.push(line.trimEnd());
                }

                asciiText = lines.join('\n');

                const pre = document.createElement('pre');
                pre.textContent = asciiText;
                pre.style.fontSize = '7px';
                pre.style.lineHeight ='1';

                output.replaceChildren(pre);
                copyButton.disabled = false;
                setStatus('rendered ' + COLUMNS + 'x' + rows);
            }

            async function guessFileType(file) {
                const bytes = new Uint8Array(await file.slice(0, 16).arrayBuffer());
                const text = (start, length) => String.fromCharCode(...bytes.slice(start, start + length));
            
            if (bytes[0] === 0x89 && text(1,3) === 'PNG') return 'png';
            if (bytes[0] === 0xff && bytes[1] === 0xd8) return 'jpeg';
            if (text(0, 3) === 'GIF') return 'gif';
            if (text(0, 4) === 'RIFF' && text(8, 4) === 'WEBP') return 'webp';
            if(text(4, 4) === 'ftyp') return 'heic/avif';
            if (text(0, 2) === 'BM') return 'bmp';
            return 'unknown';
        }

        function loadWithImageElement(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = reject;
                reader.onload = () => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = reject;
                    image.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function loadFile(file) {
            if(!file) return;

            let image = null;
            try {
                image = await createImageBitmap(file);
            } catch (error) {
            }

            if(!image) {
                try {
                    image = await loadWithImageElement(file);
                } catch (error) {
                }
            }

            if (image) {
                currentImage = image;
                render();
                return;
            }

            const realType = await guessFileType(file);
            setStatus(
                'error: cannot decode "' + file.name + '" (' + file.size + ' bytes, ' +
                'browser type "' + (file.type || 'none') + '", contents look like: ' + realType + '). ' +
            'try re-saving it as png or jpg'
            );
        }

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));

        dropZone.addEventListener('dragover', (event) => event.preventDefault());
        dropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            loadFile(event.dataTransfer.files[0]);
        });

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(asciiText);
                setStatus('copied to clipboard');
            } catch (error) {
                setStatus('error: clipboard blocked. select the text and copy');
            }
        });
        </script>
    </body>
</html>
